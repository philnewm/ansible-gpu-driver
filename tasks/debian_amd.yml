---

- name: Add ROCm repository
  become: true
  ansible.builtin.deb822_repository:
    name: rocm
    types: [deb]
    uris: "https://repo.radeon.com/rocm/apt/{{ gpu_driver_amd_rocm_version }}"
    suites: "{{ debian_release_map[ansible_facts.distribution_release | lower] }}"
    components: [main]
    architectures: [amd64]
    signed_by: https://repo.radeon.com/rocm/rocm.gpg.key
    state: present
    install_python_debian: true

- name: Set repo priority (prevent ubuntu updates repo conflicts)
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/rocm-repo
    content: |
      Package: *
      Pin: release o=repo.radeon.com,a={{ debian_release_map[ansible_facts.distribution_release | lower] }}
      Pin-Priority: 700
    mode: "0644"

- name: Install amd driver packages
  become: true
  ansible.builtin.apt:
    name: "{{ amd_driver_packages[ansible_facts.distribution | lower] | flatten }}"
    state: present
    update_cache: true

- name: Gather system groups
  ansible.builtin.getent:
    database: group

- name: Ensure ROCm-required groups exist
  ansible.builtin.assert:
    that:
      - "'video' in ansible_facts.getent_group"
      - "'render' in ansible_facts.getent_group"
    fail_msg: >-
      ROCm installation is inconsistent: required groups are missing.
      video={{ 'video' in ansible_facts.getent_group }},
      render={{ 'render' in ansible_facts.getent_group }}
    quiet: true

...
