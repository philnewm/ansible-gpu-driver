---

- name: Update package cache
  become: true
  ansible.builtin.dnf:
    update_cache: true

- name: "Add ROCm repo on {{ ansible_distribution }}"
  become: true
  ansible.builtin.yum_repository:
    name: rocm
    description: "ROCm {{ amd_rocm_version }} repository"
    baseurl: "https://repo.radeon.com/rocm/{{ rocm_repo }}/{{ amd_rocm_version }}/main"
    enabled: true
    gpgcheck: true
    gpgkey: https://repo.radeon.com/rocm/rocm.gpg.key
    priority: 50

- name: Install packages
  become: true
  loop: "{{ amd_driver_packages[ansible_os_family] | flatten }}"
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present

- name: Install 32-bit vulkan for compatibility
  become: true
  ansible.builtin.dnf:
    name: "{{ amd_vulkan_driver_32_bit }}"
    state: present

...
