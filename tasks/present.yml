---

- name: Verify vendor list
  when: (gpu_driver_vendors | difference(gpu_supported_vendors)) | length > 0
  ansible.builtin.fail:
    msg: "Non-supported gpu vendors found: {{ gpu_driver_vendors | difference(gpu_supported_vendors) }}"

- name: Install gpu driver
  loop: "{{ gpu_driver_vendors }}"
  loop_control:
    loop_var: "gpu_vendor"
  ansible.builtin.include_role:
    name: "philnewm.{{ gpu_vendor | lower }}_gpu"

...
