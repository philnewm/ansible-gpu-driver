---

- name: Verify vendor list
  when: (gpu_driver_vendors | difference(gpu_supported_vendors)) | length > 0
  ansible.builtin.fail:
    msg: "Non-supported gpu vendors found: {{ gpu_driver_vendors | difference(gpu_supported_vendors) }}"

- name: Install gpu driver
  vars:
    amd_gpu_rocm_version: "{{ gpu_driver_rocm_version }}"
    nvidia_gpu_version: "{{ gpu_driver_nvidia_version }}"
    nvidia_gpu_version_ubuntu: "{{ gpu_driver_nvidia_version_ubuntu }}"
    nvidia_gpu_version_debian: "{{ gpu_driver_nvidia_version_debian }}"
  loop: "{{ gpu_driver_vendors }}"
  loop_control:
    loop_var: "gpu_vendor"
  ansible.builtin.include_role:
    name: "philnewm.{{ gpu_vendor | lower }}_gpu"


...
