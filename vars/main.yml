---

supported_vendors:
  - nvidia
  - amd

amd_driver_packages:
  default: &amd_default_packages
    - hip-runtime-amd
    - rocm-opencl-runtime
    - mesa-vulkan-drivers
  RedHat:
    - *amd_default_packages
    - mesa-dri-drivers
  Debian:
    - *amd_default_packages
    - libgl1-mesa-dri

amd_vulkan_driver_32_bit:
  RedHat: "mesa-vulkan-drivers.i686"
  Debian: "mesa-vulkan-drivers:i386"

nvidia_driver_packages:
  RedHat: &rhel_packages
    - akmod-nvidia
    - xorg-x11-drv-nvidia-cuda
  AlmaLinux: *rhel_packages
  Rocky: *rhel_packages
  CentOS: *rhel_packages
  Ubuntu:
    - nvidia-driver-570
  Debian:
    - nvidia-driver
    - firmware-misc-nonfree

debian_release_map:
  "bookworm": "jammy"

...
